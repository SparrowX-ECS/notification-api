environment:
  name: sparrowx

service:
  name: notification-api
  stack: sparrowx-notification-api

image:
  repository: notification-api

container:
  port: 8000
  cpu: 256
  memory: 512

deployment:
  desiredCount: 1

loadBalancer:
  pathPattern: /api/notification/*
  listenerRulePriority: 110
  healthCheckPath: /health

database:
  enabled: true
  stack: sparrowx-database
  endpoint: ''
  port: 5432
  name: notificationdb
  outputs:
    endpoint: NotificationDatabaseEndpoint
    port: NotificationDatabasePort
    secret_arn: NotificationDatabaseSecretArn
    security_group_id: NotificationDatabaseSecurityGroupId
